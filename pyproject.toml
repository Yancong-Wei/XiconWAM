[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xiconwam"
version = "0.1.0"
description = "XiconWAM dual-stream world-action policies for RoboDojo"
requires-python = ">=3.10"
dependencies = [
  "accelerate==1.5.2",
  "av==16.0.1",
  "boto3==1.35.99",
  "datasets==3.6.0",
  "deepspeed==0.16.9",
  "einops==0.8.1",
  "ftfy==6.3.1",
  "huggingface-hub==0.36.2",
  "hydra-core==1.3.2",
  "imageio==2.37.0",
  "imageio-ffmpeg==0.6.0",
  "jsonlines==4.0.0",
  "loguru==0.7.3",
  "numpy==1.26.4",
  "omegaconf==2.3.0",
  "opencv-python-headless>=4.8",
  "msgpack>=1.0.8",
  "msgpack-numpy>=0.4.8",
  "pydantic>=2.5",
  "pyzmq==26.2.0",
  "packaging==26.3",
  "pandas==2.2.3",
  "peft==0.19.1",
  "pillow==12.0.0",
  "pyarrow==23.0.0",
  "pyyaml>=6",
  "regex==2025.11.3",
  "rich==14.2.0",
  "safetensors==0.5.3",
  "termcolor==2.5.0",
  "torch==2.7.1+cu128",
  "torchvision==0.22.1+cu128",
  "tqdm==4.66.5",
  "transformers==4.57.0",
  "typing-extensions==4.15.0",
  "wandb==0.23.1",
  "websockets>=14.0",
]

[project.optional-dependencies]
engine = ["xicon-engine==0.1.0.dev0"]
engine-validation = ["xicon-engine[validation]==0.1.0.dev0"]

[project.scripts]
xiconwam-bundle = "xiconwam.deployment.bundle:main"
xiconwam-engine-smoke = "xiconwam.deployment.smoke:main"
xiconwam-serve = "xiconwam.deployment.serve:main"
xiconwam-train = "xiconwam.train:main"
xiconwam-prepare-action-expert = "xiconwam.prepare_action_expert:main"
xiconwam-precompute-text = "xiconwam.precompute_text:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["xiconwam*"]

# torch==2.7.1+cu128 is not on PyPI. uv reads this index; pip needs the same URL.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.uv]
# Engine is distributed as a separately reviewed wheel, not from this registry.
# Install that wheel after uv sync; pip extras above retain the version contract.
exclude-dependencies = ["xicon-engine"]
