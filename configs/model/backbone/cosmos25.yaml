name: cosmos25
model_id: ./playground/pretrained_models/Cosmos-Predict2.5-2B
reason_model_id: ./playground/pretrained_models/Cosmos-Reason1-7B
tokenizer_max_len: 128
load_text_encoder: false
text_encoder_id: cosmos_reason1_7b
text_dim: 1024
attention_backend: auto
use_gradient_checkpointing: false
# Options: first_frame_causal, per_frame_causal, bidirectional. Keep first_frame_causal by default.
video_attention_mask_mode: first_frame_causal
num_layers: 28
num_heads: 16
attn_head_dim: 128
hidden_dim: 2048
freq_dim: 2048
video_hidden_layer: 16
action_dit_pretrained_path: ./playground/pretrained_models/ActionDiT_Cosmos25_2b.pt

video_scheduler:
  family: flow_unipc
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000
  time_distribution: logitnormal
  conditional_frame_timestep: 0.0001
  training_weight: uniform
  use_karras_sigmas: true
loss:
  lambda_video: 1.0
  lambda_action: 1.0
action_expert:
  preset: standard
  cross_attention: true
  action_dim: 48
  projector_hidden_dim: 64
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: ${model.backbone.num_heads}
  attn_head_dim: ${model.backbone.attn_head_dim}
  num_layers: ${model.backbone.num_layers}
  text_dim: ${model.backbone.text_dim}
  freq_dim: ${model.backbone.freq_dim}
  eps: 1.0e-06
  attention_backend: ${model.backbone.attention_backend}
  use_gradient_checkpointing: ${model.backbone.use_gradient_checkpointing}

lora_target_modules:
  - self_attn.q_proj
  - self_attn.k_proj
  - self_attn.v_proj
  - self_attn.output_proj
  - cross_attn.q_proj
  - cross_attn.k_proj
  - cross_attn.v_proj
  - cross_attn.output_proj
  - mlp.layer1
  - mlp.layer2
