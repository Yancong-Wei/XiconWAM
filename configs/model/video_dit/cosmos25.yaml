name: cosmos25
from_scratch: false
model_id: ./playground/pretrained_models/Cosmos-Predict2.5-2B
reason_model_id: ./playground/pretrained_models/Cosmos-Reason1-7B
tokenizer_max_len: 128
load_text_encoder: false
text_encoder_id: cosmos_reason1_7b
text_dim: ${.dit_config.context_dim}
attention_backend: auto
use_gradient_checkpointing: false
# Options: first_frame_causal, per_frame_causal, bidirectional. Keep first_frame_causal by default.
video_attention_mask_mode: first_frame_causal
num_layers: ${.dit_config.num_layers}
num_heads: ${.dit_config.num_heads}
attn_head_dim: 128
hidden_dim: ${.dit_config.hidden_size}
freq_dim: ${.dit_config.hidden_size}

dit_config:
  in_channels: 18
  out_channels: 16
  hidden_size: 2048
  context_dim: 1024
  reason_context_dim: 100352
  num_layers: 28
  num_heads: 16
  intermediate_size: 8192
  adaln_lora_dim: 256
  patch_size: [1, 2, 2]

video_scheduler:
  family: flow_unipc
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000
  time_distribution: logitnormal
  conditional_frame_timestep: 0.0001
  training_weight: uniform
  use_karras_sigmas: true
lora_target_modules:
  - self_attn.q_proj
  - self_attn.k_proj
  - self_attn.v_proj
  - self_attn.output_proj
  - cross_attn.q_proj
  - cross_attn.k_proj
  - cross_attn.v_proj
  - cross_attn.output_proj
  - mlp.layer1
  - mlp.layer2

# Adapter settings belong to the video component; frozen encoders are not adapted.
lora:
  enable: false
  target: video
  rank: 16
  alpha: 32
