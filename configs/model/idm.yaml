defaults:
  - video_dit: wan22
  - action_dit: ${model/video_dit}
  - _self_

_target_: xiconwam.launch.build_model
architecture: idm
state_dim: 48
state_position: sequence
state_encoder_hidden_dim: 64
video_cond_noise_prob: 0.5

# Component updates are restored after every evaluation.
training:
  mode: joint
  freeze_video: false
  freeze_action: false

loss:
  lambda_video: 1.0
  lambda_action: 1.0
