# Multi-source pretrain shell. SFT keeps selecting a single data yaml
# (e.g. `data: robodojo`). Add another source by composing it under
# `sources.<name>` and enabling it below.
defaults:
  - robodojo@sources.robodojo
  - _self_

train:
  _target_: xiconwam.data.mixture.build_mixture_dataset
  _recursive_: false
  weight_strategy: proportional
  seed: ${seed}
  sources:
    robodojo:
      enabled: true
      config: ${data.sources.robodojo.train}
