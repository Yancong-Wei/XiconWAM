defaults:
  - video_dit: wan22
  - action_dit: ${model/video_dit}
  - _self_

_target_: xiconwam.launch.build_model
architecture: hide
state_dim: 48
state_position: sequence
state_encoder_hidden_dim: 64

# Fixed noise level used only to read video features. 1.0 is the pure-noise end.
feature_timestep: 1.0
feature_layer: auto  # Wan: 17; Cosmos: 16. Explicit overrides are zero-based.

# Repeat the action loss with independent noise; this is not the sampling step count.
repeated_diffusion_steps: 1
action_inference_steps: 4
noise_beta_alpha: 1.5
noise_beta_beta: 1.0
noise_s: 0.999

# Scales multiply task.learning_rate; the action group includes the state encoder.
learning_rate_scale:
  video: 0.1
  action: 1.0

# HIDE uses the Beta distribution above and a fixed-step Euler action sampler.
# The generic MoT/IDM Action scheduler is not used on this path.
action_dit:
  scheduler: null

# Component updates are restored after every evaluation.
training:
  mode: joint
  freeze_video: false
  freeze_action: false

loss:
  lambda_video: 1.0
  lambda_action: 1.0
