name: flux2
variant: klein-base-4b
model_path: ./playground/pretrained_models/flux2/FLUX.2-klein-base-4B/flux-2-klein-base-4b.safetensors
ae_model_path: ./playground/pretrained_models/flux2/FLUX.2-dev/ae.safetensors
qwen3_model_spec: Qwen/Qwen3-4B
qwen3_output_layers: [9, 18, 27]
tokenizer_max_len: 512
load_text_encoder: false
text_encoder_id: qwen3_flux2
text_dim: 7680
attention_backend: auto
use_gradient_checkpointing: false
hidden_dim: 3072
freq_dim: 256
num_heads: 24
attn_head_dim: 128
num_layers_double: 5
num_layers_single: 20
video_hidden_layer: 17
action_dit_pretrained_path: ./playground/pretrained_models/ActionDiT_Flux2_4b.pt

video_scheduler:
  family: continuous_flow
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000
loss:
  lambda_video: 0.5
  lambda_action: 1.0
action_expert:
  preset: staged
  cross_attention: false
  text_dim: ${model.backbone.text_dim}
  num_heads: ${model.backbone.num_heads}
  attn_head_dim: ${model.backbone.attn_head_dim}
  num_layers_double: ${model.backbone.num_layers_double}
  num_layers_single: ${model.backbone.num_layers_single}
  action_dim: 48
  hidden_dim: 1024
  mlp_ratio: 4.0
  max_action_horizon: 1024
  attention_backend: ${model.backbone.attention_backend}
  use_gradient_checkpointing: ${model.backbone.use_gradient_checkpointing}

lora_target_modules:
  - transformer.double_blocks
  - transformer.single_blocks
